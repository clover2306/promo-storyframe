name: Render Promo StoryFrame (30 detik vertikal)

# Render komposisi Promo (1080x1920, 30fps, ~31 dtk) tanpa audio.
# Narasi + BGM digabung secara lokal (audio tidak masuk repo publik).
on:
  workflow_dispatch:

jobs:
  render:
    name: Render Promo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Render Promo
        run: npx remotion render Promo promo-silent.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: promo-silent
          path: promo-silent.mp4
          retention-days: 7
